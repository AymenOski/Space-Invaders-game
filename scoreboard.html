
<div id="scoreboard-popup" class="hidden popup">
  <h2>🏆 Scoreboard</h2>
  <table id="score-table">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Score</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody>
      <!-- scores will be inserted here dynamically -->
    </tbody>
  </table>
  <div class="pagination">
    <button id="prev-page">⬅ Prev</button>
    <span id="page-info">Page 1</span>
    <button id="next-page">Next ➡</button>
  </div>
  <button id="close-scoreboard">Close</button>
</div>
